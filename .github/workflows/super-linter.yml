name: Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Super-Linter v7 forbids mixing VALIDATE_*=true with VALIDATE_*=false.
      # Only enable linters that match this repo:
      # - JSON ESLint is skipped: Super-Linter still passes --ext, which ESLint 9
      #   flat config rejects.
      # - JS/TS/MD Prettier is skipped: the image ships Prettier 3.5.2; Atlas
      #   uses 3.9.6 via `npm run format`. JSON/YAML Prettier stay on.
      - name: Super-Linter
        uses: super-linter/super-linter@v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          FILTER_REGEX_EXCLUDE: ".*(node_modules|\\.vercel|\\.nitro|dist|routeTree\\.gen\\.ts|package-lock\\.json|screenshots|catboost_info).*"
